<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>

  <div class ="pt-3 px-5">
    <h2>Form View</h2>
  </div>
    <div class="w-50">
    <form method="post" class="px-3 pt-3 row g-0 border-top border-bottom border-start border-end">
        {%csrf_token%}
        <div class="mb-3 row">
            <label for="name" class="col-sm-2 col-form-label">name</label>
            <div class="col-sm-10">
              {{form.name}}
            </div>
            {% for error in form.name.errors %} <li class="text-danger">{{ error }}</li> {% endfor %}
          </div>

          <div class="mb-3 row">
            <label for="name" class="col-sm-2 col-form-label">title</label>
            <div class="col-sm-10">
              {{form.title}}
            </div>
            {% for error in form.title.errors %} <li class="text-danger">{{ error }}</li> {% endfor %}
          </div>

          <div class="mb-3 row">
            <label for="message" class="col-sm-2 col-form-label">Article</label>
            <div class="col-sm-10">
            {{form.message}}            
        </div>
          </div> 
          <div class="col-auto">
            <button type="submit" class="btn btn-primary mb-3 px-5 rounded-pill">Confirm</button>
          </div>
      </form>
    </div>
</body>
</html>
