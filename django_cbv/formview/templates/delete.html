<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
         <div class="container py-5">
            <h2>Confirm Deletion</h2>
            <p>Are you sure you want to permanently delete "{{ object.title }}"? This action cannot be undone.</p>
            <form method="post" action="{%url 'form_views:delete' object.slug%}">
                {% csrf_token %}
                <button class=" px-5 w-10 btn-success rounded-pill btn " type="submit">delete</button>
                
                <a class="text-light bg-danger rounded-pill px-5 py-2 mx-4 " href="{%url 'form_views:listView' %}">cancel</a>
            </form>
         </div>
</body>
</html>
